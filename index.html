  <title>Simulador A1 · Reglas de tránsito</title>

  <style>
/* Simulador A1: estilos mobile first, sin frameworks. Colores como tokens en :root. */

:root {
  color-scheme: light dark;
  --fondo: #f5f7fb;
  --superficie: #ffffff;
  --superficie-suave: #eef2f8;
  --texto: #18202f;
  --texto-suave: #5a6478;
  --borde: #d6dce8;
  --primario: #1d5fd1;
  --primario-hover: #184eac;
  --primario-texto: #ffffff;
  --exito: #17703a;
  --exito-fondo: #e3f7ea;
  --error: #b42318;
  --error-fondo: #fde8e6;
  --aviso: #7a5200;
  --aviso-fondo: #fff4cc;
  --sombra: 0 4px 18px rgba(20, 32, 60, 0.08);
  --radio: 14px;
  --radio-pequeno: 10px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0d1420;
    --superficie: #162132;
    --superficie-suave: #1d2a40;
    --texto: #e8edf7;
    --texto-suave: #a3afc4;
    --borde: #2c3a54;
    --primario: #5b9cff;
    --primario-hover: #7bb0ff;
    --primario-texto: #0b1220;
    --exito: #6fdc97;
    --exito-fondo: #123324;
    --error: #ff8a80;
    --error-fondo: #3a1a1a;
    --aviso: #f5d27a;
    --aviso-fondo: #3a3014;
    --sombra: 0 4px 18px rgba(0, 0, 0, 0.35);
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--fondo);
  color: var(--texto);
  line-height: 1.5;
}

h1 {
  font-size: clamp(1.4rem, 4vw, 1.9rem);
  margin: 0 0 0.5rem;
}

h2 {
  font-size: 1.15rem;
  margin: 1.25rem 0 0.5rem;
}

h3 {
  font-size: 1rem;
  margin: 0 0 0.5rem;
}

p {
  margin: 0.5rem 0;
}

a {
  color: var(--primario);
}

:focus-visible {
  outline: 3px solid var(--primario);
  outline-offset: 2px;
}

main:focus {
  outline: none;
}

/* Cabecera y navegación */
.cabecera {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--superficie);
  border-bottom: 1px solid var(--borde);
}

.cabecera__interior {
  max-width: 960px;
  margin: 0 auto;
  padding: 0.7rem 1rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 1rem;
}

.marca {
  font-weight: 700;
  color: var(--texto);
  text-decoration: none;
}

.navegacion {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
}

.navegacion a {
  padding: 0.4rem 0.7rem;
  border-radius: 999px;
  color: var(--texto-suave);
  text-decoration: none;
  font-size: 0.95rem;
}

.navegacion a[aria-current="page"] {
  background: var(--primario);
  color: var(--primario-texto);
  font-weight: 600;
}

.contenedor {
  flex: 1;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding: 1.1rem 1rem 2rem;
}

.pie {
  max-width: 960px;
  margin: 0 auto;
  padding: 1rem;
  font-size: 0.85rem;
  color: var(--texto-suave);
}

/* Tarjetas y avisos */
.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  padding: 1.1rem;
  margin-bottom: 1rem;
}

.aviso {
  border-radius: var(--radio-pequeno);
  padding: 0.8rem 1rem;
  background: var(--superficie-suave);
  border: 1px solid var(--borde);
  margin-bottom: 1rem;
}

.aviso--advertencia {
  background: var(--aviso-fondo);
  color: var(--aviso);
  border-color: transparent;
}

.aviso-suave {
  color: var(--texto-suave);
  font-size: 0.9rem;
}

.lista-reglas {
  padding-left: 1.2rem;
}

/* Botones */
.btn {
  font: inherit;
  min-height: 44px;
  padding: 0.6rem 1rem;
  border-radius: var(--radio-pequeno);
  border: 1px solid var(--borde);
  background: var(--superficie);
  color: var(--texto);
  cursor: pointer;
}

.btn:hover:not(:disabled) {
  border-color: var(--primario);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn--primario {
  background: var(--primario);
  border-color: var(--primario);
  color: var(--primario-texto);
  font-weight: 600;
}

.btn--primario:hover:not(:disabled) {
  background: var(--primario-hover);
}

.btn--texto {
  border-color: transparent;
  background: transparent;
  color: var(--primario);
  padding-inline: 0.25rem;
}

.btn--peligro {
  color: var(--error);
}

.acciones {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 1rem;
}

.acciones .btn {
  flex: 1 1 130px;
}

/* Inicio */
.hero {
  margin: 0.5rem 0 1.2rem;
}

.hero__subtitulo {
  color: var(--texto-suave);
  margin: 0;
}

.tarjetas-accion {
  display: grid;
  gap: 0.85rem;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  margin-bottom: 1rem;
}

.tarjeta-accion {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  text-decoration: none;
  color: inherit;
  margin-bottom: 0;
}

.tarjeta-accion h2 {
  margin: 0;
}

.tarjeta-accion p {
  margin: 0;
  color: var(--texto-suave);
}

.tarjeta-accion:hover {
  border-color: var(--primario);
}

.lista-pendientes,
.lista-fuentes {
  padding-left: 1.2rem;
  font-size: 0.95rem;
}

.lista-fuentes small,
.lista-pendientes li {
  color: var(--texto-suave);
}

/* Formularios */
.campo {
  display: grid;
  gap: 0.35rem;
  margin: 1rem 0;
}

select {
  font: inherit;
  min-height: 44px;
  padding: 0.5rem 0.7rem;
  border-radius: var(--radio-pequeno);
  border: 1px solid var(--borde);
  background: var(--superficie);
  color: var(--texto);
}

/* Preguntas */
.pregunta {
  margin: 0.75rem 0 1rem;
}

.pregunta__imagen {
  display: block;
  max-width: min(100%, 280px);
  max-height: 230px;
  height: auto;
  margin: 0 auto 0.75rem;
  background: #ffffff;
  border-radius: var(--radio-pequeno);
  padding: 0.5rem;
}

.pregunta__enunciado {
  font-size: 1.05rem;
  font-weight: 500;
  margin: 0;
}

.opciones {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.5rem;
}

.opcion {
  width: 100%;
  min-height: 44px;
  display: flex;
  gap: 0.6rem;
  align-items: flex-start;
  text-align: left;
  font: inherit;
  padding: 0.7rem 0.9rem;
  border-radius: var(--radio-pequeno);
  border: 1px solid var(--borde);
  background: var(--superficie);
  color: var(--texto);
  cursor: pointer;
}

.opcion:hover:not(:disabled) {
  border-color: var(--primario);
}

.opcion:disabled {
  cursor: default;
}

/* Usa sombra interior para no mover el diseño al seleccionar */
.opcion--seleccionada {
  background: var(--superficie-suave);
  box-shadow: inset 0 0 0 2px var(--primario);
}

.opcion--correcta {
  background: var(--exito-fondo);
  box-shadow: inset 0 0 0 2px var(--exito);
}

.opcion--incorrecta {
  background: var(--error-fondo);
  box-shadow: inset 0 0 0 2px var(--error);
}

.opcion__letra {
  font-weight: 700;
  min-width: 1.6rem;
}

/* Retroalimentación */
.retroalimentacion {
  margin-top: 1rem;
  padding: 1rem;
  border-radius: var(--radio-pequeno);
  border: 1px solid var(--borde);
  background: var(--superficie-suave);
}

.retroalimentacion--exito {
  background: var(--exito-fondo);
  border-color: transparent;
}

.retroalimentacion--error {
  background: var(--error-fondo);
  border-color: transparent;
}

.retroalimentacion--aviso {
  background: var(--aviso-fondo);
  border-color: transparent;
}

.retroalimentacion__titulo {
  margin-bottom: 0.4rem;
}

.retroalimentacion__fuente {
  font-size: 0.88rem;
  color: var(--texto-suave);
}

/* Sesiones de estudio y simulacro */
.sesion__cabecera,
.simulacro__barra {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem 1rem;
  font-weight: 600;
}

.sesion__progreso,
.simulacro__progreso {
  font-size: 0.95rem;
}

.sesion__titulo {
  margin: 0.5rem 0 0;
  font-size: 1rem;
  color: var(--texto-suave);
  font-weight: 600;
}

.reloj {
  font-variant-numeric: tabular-nums;
  padding: 0.3rem 0.75rem;
  border-radius: 999px;
  background: var(--superficie-suave);
}

.reloj--urgente {
  background: var(--error-fondo);
  color: var(--error);
}

.simulacro__tiempo {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.simulacro--pausa .reloj {
  display: inline-block;
  font-size: 1.75rem;
  margin: 0.5rem 0;
}

.mapa {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
  gap: 0.35rem;
  margin: 0.75rem 0 0.25rem;
}

.mapa__casilla {
  min-height: 38px;
  font: inherit;
  font-size: 0.85rem;
  border-radius: 8px;
  border: 1px solid var(--borde);
  background: var(--superficie);
  color: var(--texto);
  cursor: pointer;
}

.mapa__casilla--respondida {
  background: var(--superficie-suave);
  font-weight: 700;
}

.mapa__casilla--actual {
  outline: 2px solid var(--primario);
  outline-offset: 1px;
}

/* Resultados */
.resultado__puntaje {
  font-size: clamp(2.2rem, 8vw, 3rem);
  font-weight: 700;
  margin: 0.25rem 0;
}

.resultado--aprobado .resultado__puntaje {
  color: var(--exito);
}

.resultado--reprobado .resultado__puntaje {
  color: var(--error);
}

.resumen-cifras {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 1.2rem;
  list-style: none;
  padding: 0;
  margin: 0.75rem 0;
  font-size: 0.95rem;
}

.revision {
  margin-top: 1.25rem;
}

.revision summary {
  cursor: pointer;
  font-weight: 600;
  padding: 0.5rem 0;
}

.revision__item {
  border-top: 1px solid var(--borde);
  padding: 1rem 0;
}

/* Estadísticas */
.tarjetas-metricas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.metrica {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  margin-bottom: 0;
}

.metrica__titulo {
  color: var(--texto-suave);
  font-size: 0.9rem;
}

.metrica__valor {
  font-size: 1.7rem;
  font-weight: 700;
}

.metrica__detalle {
  color: var(--texto-suave);
  font-size: 0.85rem;
}

.barra-progreso {
  height: 10px;
  border-radius: 999px;
  background: var(--superficie-suave);
  overflow: hidden;
  margin-top: 0.75rem;
}

.barra-progreso__relleno {
  height: 100%;
  background: var(--exito);
}

.tabla-scroll {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.93rem;
}

th,
td {
  text-align: left;
  padding: 0.5rem 0.6rem;
  border-bottom: 1px solid var(--borde);
  vertical-align: top;
}

th {
  color: var(--texto-suave);
  font-weight: 600;
}

.lista-temas {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.5rem;
}

.lista-temas__item {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
}

/* Pantallas pequeñas */
@media (max-width: 480px) {
  .navegacion a {
    padding: 0.35rem 0.55rem;
    font-size: 0.9rem;
  }

  .mapa {
    grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
  }
}

  </style>
</head>

/**
 * Utilidades de aleatorización. El generador es inyectable para poder verificar el comportamiento.
 */
(function (raiz) {
  const ns = (raiz.SimuladorA1 = raiz.SimuladorA1 || {});

  /** Devuelve una copia mezclada (Fisher-Yates). No modifica el arreglo original. */
  function mezclar(elementos, generadorAleatorio = Math.random) {
    const copia = [...elementos];
    for (let indice = copia.length - 1; indice > 0; indice -= 1) {
      const indiceAleatorio = Math.floor(generadorAleatorio() * (indice + 1));
      [copia[indice], copia[indiceAleatorio]] = [copia[indiceAleatorio], copia[indice]];
    }
    return copia;
  }

  /** Elige una cantidad de elementos distintos, sin repetir ninguno. */
  function elegirSinRepetir(elementos, cantidad, generadorAleatorio = Math.random) {
    if (cantidad > elementos.length) {
      throw new RangeError(`Se piden ${cantidad} elementos y solo hay ${elementos.length}.`);
    }
    return mezclar(elementos, generadorAleatorio).slice(0, cantidad);
  }

  ns.Aleatorio = { mezclar, elegirSinRepetir };

  function registrarIdsUnicos(elementos, etiqueta, errores) {
    const ids = new Set();
    elementos.forEach((elemento, posicion) => {
      const id = elemento?.id;
      if (!esTextoNoVacio(id)) {
        errores.push(`El ${etiqueta} en la posición ${posicion + 1} no tiene id.`);
        return;
      }
      if (ids.has(id)) {
        errores.push(`El id de ${etiqueta} "${id}" está repetido.`);
      }
      ids.add(id);
    });

  }

  function validarFuente(fuente, errores) {
    const etiqueta = `Fuente ${fuente?.id ?? '(sin id)'}`;
    if (!esTextoNoVacio(fuente?.titulo)) errores.push(`${etiqueta}: falta el título.`);
    if (fuente?.url !== null && fuente?.url !== undefined && !PATRON_URL_HTTPS.test(fuente.url)) {
      errores.push(`${etiqueta}: la URL debe empezar por https:// o ser null.`);
    }
  }

  function validarAlternativas(pregunta, etiqueta, errores) {
    const alternativas = pregunta?.alternativas;
    if (!Array.isArray(alternativas) || alternativas.length < 2 || alternativas.length > LETRAS_ORDENADAS.length) {
      errores.push(`${etiqueta}: debe tener entre 2 y ${LETRAS_ORDENADAS.length} alternativas.`);
      return;
    }
    const letrasEsperadas = LETRAS_ORDENADAS.slice(0, alternativas.length);
    const letrasEncontradas = alternativas.map((alternativa) => alternativa?.letra);
    if (letrasEncontradas.join(',') !== letrasEsperadas.join(',')) {
      errores.push(`${etiqueta}: las letras deben ser ${letrasEsperadas.join(', ')}, en ese orden.`);
    }
    alternativas.forEach((alternativa) => {
      if (!esTextoNoVacio(alternativa?.texto)) {
        errores.push(`${etiqueta}: la alternativa ${alternativa?.letra} no tiene texto.`);

    const tieneImagen = pregunta?.imagen !== null && pregunta?.imagen !== undefined;

    const tieneExplicacion = pregunta?.explicacion !== null && pregunta?.explicacion !== undefined;
    if (tieneExplicacion && !esTextoNoVacio(pregunta.explicacion)) {

    if (!banco || typeof banco !== 'object' || Array.isArray(banco)) {
      return { valido: false, errores: ['El banco debe ser un objeto JSON.'] };
    }
    if (!Array.isArray(banco.temas)) errores.push('Falta la lista "temas".');
    if (!Array.isArray(banco.preguntas)) errores.push('Falta la lista "preguntas".');
    if (!Array.isArray(banco.meta?.fuentes)) errores.push('Falta la lista "meta.fuentes".');

    const temas = Array.isArray(banco.temas) ? banco.temas : [];
    const preguntas = Array.isArray(banco.preguntas) ? banco.preguntas : [];
    const fuentes = Array.isArray(banco.meta?.fuentes) ? banco.meta.fuentes : [];

(function (raiz) {

  function evaluarDisponibilidad(banco, configuracion = ns.Configuracion.simulacro) {
    const disponibles = banco.preguntas.length;
    return {
      disponible: disponibles >= configuracion.cantidadPreguntas,
      disponibles,
      necesarias: configuracion.cantidadPreguntas,
    };
  }

  function construirSimulacro(banco, generadorAleatorio = Math.random, configuracion = ns.Configuracion.simulacro) {
    const disponibilidad = evaluarDisponibilidad(banco, configuracion);
    if (!disponibilidad.disponible) {

    }
    return ns.Aleatorio.elegirSinRepetir(banco.preguntas, configuracion.cantidadPreguntas, generadorAleatorio);
  }

  /**
   * Evalúa un simulacro. `respuestas` es un mapa { idPregunta: letra }.
   * Las preguntas sin respuesta cuentan como no correctas y no se penalizan de otra forma.
   */
  function evaluarRespuestas(preguntasSimulacro, respuestas, aciertosMinimos) {
    const detalle = preguntasSimulacro.map((pregunta) => {
      const elegida = respuestas[pregunta.id] ?? null;
      let estado = 'sin_responder';
      if (elegida !== null) {
        estado = elegida === pregunta.respuestaCorrecta ? 'correcta' : 'incorrecta';
      }
      return { pregunta, elegida, estado };

    const total = detalle.length;
    const aciertos = detalle.filter((item) => item.estado === 'correcta').length;
    const sinResponder = detalle.filter((item) => item.estado === 'sin_responder').length;

    return {
      total,
      aciertos,
      sinResponder,
      incorrectas: total - aciertos - sinResponder,
      porcentaje: total === 0 ? 0 : Math.round((aciertos / total) * 100),

/**

(function (raiz) {
  const ns = (raiz.SimuladorA1 = raiz.SimuladorA1 || {});

  function aplicarPropiedad(elemento, nombre, valor) {
    if (valor === null || valor === undefined || valor === false) return;
    if (nombre === 'clase') {
      elemento.className = valor;
      return;
    }
    if (nombre === 'texto') {
      elemento.textContent = valor;
      return;
    }
    if (nombre.startsWith('on') && typeof valor === 'function') {
      elemento.addEventListener(nombre.slice(2), valor);
      return;
    }
    elemento.setAttribute(nombre, valor === true ? '' : String(valor));
  }

  function agregarHijos(elemento, hijos) {
    [hijos].flat(Infinity).forEach((hijo) => {
      if (hijo === null || hijo === undefined || hijo === false) return;
      elemento.append(hijo instanceof Node ? hijo : document.createTextNode(String(hijo)));

    const elemento = document.createElement(etiqueta);
    Object.entries(propiedades).forEach(([nombre, valor]) => aplicarPropiedad(elemento, nombre, valor));

                alSalir: () => renderizarEstudio(contenedor, contexto),
              });
            },
          }),
        ]),
      ]),
    );
  }

  function filaTemaBajoRendimiento(tema, contenedor, contexto) {
    return crear('li', { clase: 'lista-temas__item' }, [
      crear('span', { texto: `${tema.nombre}: ${tema.porcentaje}% de aciertos (${tema.respuestas} respuestas)` }),
      crear('button', {
        type: 'button',
        clase: 'btn',
        texto: 'Practicar tema',
        onclick: () =>
          iniciarSesionGuiada(contenedor, contexto, {
            titulo: tema.nombre,
            preguntas: ns.Estudio.construirSesionEstudio(contexto.banco, tema.id),
            alSalir: () => renderizarRefuerzo(contenedor, contexto),
          }),
      }),
    ]);
  }

  function renderizarRefuerzo(contenedor, contexto) {
    const { banco } = contexto;
    const progreso = contexto.obtenerProgreso();
    const falladas = ns.Estudio.construirSesionRefuerzo(banco, progreso);
    const temasBajos = ns.Estadisticas
      .calcularRendimientoPorTema(banco, progreso)
      .filter((tema) => tema.bajoRendimiento);
    const { minimoRespuestasPorTema } = ns.Configuracion.refuerzo;

    contenedor.replaceChildren(
      crear('section', { clase: 'tarjeta' }, [
        crear('h1', { texto: 'Refuerzo' }),
        crear('h2', { texto: 'Preguntas falladas' }),
        crear('p', {
          texto:
            falladas.length > 0
              ? `Tienes ${falladas.length} preguntas cuya última respuesta fue incorrecta. Salen de la lista al acertarlas.`
              : 'No tienes preguntas falladas pendientes.',
        }),
        crear('div', { clase: 'acciones' }, [
          crear('button', {
            type: 'button',
            clase: 'btn btn--primario',
            texto: 'Practicar falladas',
            disabled: falladas.length === 0,
            onclick: () =>
              iniciarSesionGuiada(contenedor, contexto, {
                titulo: 'Preguntas falladas',
                preguntas: falladas,
                alSalir: () => renderizarRefuerzo(contenedor, contexto),
              }),
          }),
        ]),
      ]),
      crear('section', { clase: 'tarjeta' }, [
        crear('h2', { texto: 'Temas con bajo rendimiento' }),
        temasBajos.length > 0
          ? crear('ul', { clase: 'lista-temas' }, temasBajos.map((tema) => filaTemaBajoRendimiento(tema, contenedor, contexto)))
          : crear('p', {
              texto: `Ningún tema figura con bajo rendimiento todavía. Se evalúan temas con al menos ${minimoRespuestasPorTema} respuestas.`,
            }),
      ]),
    );
  }

  ns.Vistas = Object.assign(ns.Vistas || {}, {
    estudio: renderizarEstudio,
    refuerzo: renderizarRefuerzo,
  });
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/**
 * Simulacro: portada, examen cronometrado, pausa, entrega y revisión.
 * El tiempo se mide en tramos con Date.now(), así no se atrasa si el navegador pausa la pestaña.
 * Pausar cierra el tramo activo. Al agotarse el tiempo, el usuario puede reiniciarlo y seguir en la misma pregunta.
 */
(function (raiz) {
  const ns = (raiz.SimuladorA1 = raiz.SimuladorA1 || {});
  const { crear } = ns.Dom;
  const { formatearTiempo, crearEnunciado, crearOpciones, crearRetroalimentacion, claseReloj } = ns.Componentes;

  function renderizarSimulacro(contenedor, contexto) {
    const disponibilidad = ns.Simulacro.evaluarDisponibilidad(contexto.banco);
    if (!disponibilidad.disponible) {
      contenedor.replaceChildren(
        crear('section', { clase: 'tarjeta aviso aviso--advertencia' }, [
          crear('h1', { texto: 'Simulacro no disponible' }),
          crear('p', {
            texto: `El simulacro necesita ${disponibilidad.necesarias} preguntas verificadas y el banco tiene ${disponibilidad.disponibles}.`,
          }),
        ]),
      );
      return;
    }
    mostrarPortada(contenedor, contexto);
  }

  function mostrarPortada(contenedor, contexto) {
    const { cantidadPreguntas, duracionMinutos, aciertosMinimos } = ns.Configuracion.simulacro;
    contenedor.replaceChildren(
      crear('section', { clase: 'tarjeta' }, [
        crear('h1', { texto: 'Simulacro de examen' }),
        crear('p', {
          texto: `Responderás ${cantidadPreguntas} preguntas tomadas al azar del banco, sin repetir ninguna, en ${duracionMinutos} minutos.`,
        }),
        crear('p', { texto: `Necesitas al menos ${aciertosMinimos} respuestas correctas para figurar como aprobado en este simulador.` }),
        crear('ul', { clase: 'lista-reglas' }, [
          crear('li', { texto: 'Cada intento genera una combinación distinta de preguntas.' }),
          crear('li', { texto: 'Puedes cambiar tus respuestas en cualquier momento antes de entregar.' }),
          crear('li', { texto: 'Puedes pausar el tiempo. Mientras esté en pausa, las preguntas se ocultan.' }),
          crear('li', { texto: 'Si se agota el tiempo, puedes reiniciarlo y seguir en la misma pregunta, o entregar el simulacro.' }),
          crear('li', { texto: 'Este simulador no garantiza aprobar el examen oficial.' }),
        ]),
        crear('div', { clase: 'acciones' }, [
          crear('button', {
            type: 'button',
            clase: 'btn btn--primario',
            texto: 'Comenzar simulacro',
            onclick: () => iniciarIntento(contenedor, contexto),
          }),
        ]),
      ]),
    );
  }

  function iniciarIntento(contenedor, contexto) {
    const duracionMs = ns.Configuracion.simulacro.duracionMinutos * 60 * 1000;
    const intento = {
      preguntas: ns.Simulacro.construirSimulacro(contexto.banco),
      respuestas: {},
      indice: 0,
      duracionMs,
      restanteMs: duracionMs,
      tiempoUsadoMs: 0,
      corriendo: false,
      marcaInicio: null,
      vencimientos: 0,
      temporizador: null,
    };

    arrancarTramo(intento);
    intento.temporizador = setInterval(() => atenderTick(contenedor, contexto, intento), 1000);
    contexto.establecerSesionActiva(() => clearInterval(intento.temporizador));
    mostrarPregunta(contenedor, contexto, intento);
  }

  /* Control del tiempo: el intento corre en tramos. Un tramo empieza al reanudar y termina al pausar o vencer. */

  function transcurridoEnTramo(intento) {
    return intento.corriendo ? Date.now() - intento.marcaInicio : 0;
  }

  function restanteActual(intento) {
    return Math.max(0, intento.restanteMs - transcurridoEnTramo(intento));
  }

  function arrancarTramo(intento) {
    intento.corriendo = true;
    intento.marcaInicio = Date.now();
  }

  function cerrarTramo(intento) {
    if (!intento.corriendo) return;
    const transcurrido = Math.min(transcurridoEnTramo(intento), intento.restanteMs);
    intento.restanteMs -= transcurrido;
    intento.tiempoUsadoMs += transcurrido;
    intento.corriendo = false;
    intento.marcaInicio = null;
  }

  function atenderTick(contenedor, contexto, intento) {
    if (intento.corriendo && restanteActual(intento) <= 0) {
      cerrarTramo(intento);
      registrarVencimiento(contenedor, contexto, intento);
      return;
    }
    actualizarReloj(contenedor, restanteActual(intento));
  }

  function registrarVencimiento(contenedor, contexto, intento) {
    intento.vencimientos += 1;
    mostrarTiempoAgotado(contenedor, contexto, intento);
  }

  function pausarTiempo(contenedor, contexto, intento) {
    cerrarTramo(intento);
    if (intento.restanteMs <= 0) {
      registrarVencimiento(contenedor, contexto, intento);
      return;
    }
    mostrarPausa(contenedor, contexto, intento);
  }

  function reanudarTiempo(contenedor, contexto, intento) {
    arrancarTramo(intento);
    mostrarPregunta(contenedor, contexto, intento);
  }

  function reiniciarTiempo(contenedor, contexto, intento) {
    intento.restanteMs = intento.duracionMs;
    arrancarTramo(intento);
    mostrarPregunta(contenedor, contexto, intento);
  }

  function actualizarReloj(contenedor, milisegundosRestantes) {
    const reloj = contenedor.querySelector('[data-reloj]');
    if (!reloj) return;
    reloj.textContent = formatearTiempo(milisegundosRestantes);
    reloj.className = claseReloj(milisegundosRestantes);
  }

  /* Vistas */

  function claseCasillaMapa(intento, indice) {
    const clases = ['mapa__casilla'];
    if (indice === intento.indice) clases.push('mapa__casilla--actual');
    if (intento.respuestas[intento.preguntas[indice].id]) clases.push('mapa__casilla--respondida');
    return clases.join(' ');
  }

  function mostrarPregunta(contenedor, contexto, intento) {
    const total = intento.preguntas.length;
    const pregunta = intento.preguntas[intento.indice];
    const restante = restanteActual(intento);
    const redibujar = () => mostrarPregunta(contenedor, contexto, intento);

    contenedor.replaceChildren(
      crear('section', { clase: 'tarjeta simulacro' }, [
        crear('header', { clase: 'simulacro__barra' }, [
          crear('span', { clase: 'simulacro__progreso', texto: `Pregunta ${intento.indice + 1} de ${total}` }),
          crear('div', { clase: 'simulacro__tiempo' }, [
            crear('span', {
              clase: claseReloj(restante),
              'data-reloj': true,
              'aria-label': 'Tiempo restante',
              texto: formatearTiempo(restante),
            }),
            crear('button', {
              type: 'button',
              clase: 'btn',
              texto: 'Pausar',
              'aria-label': 'Pausar el tiempo del simulacro',
              onclick: () => pausarTiempo(contenedor, contexto, intento),
            }),
          ]),
        ]),
        crear(
          'nav',
          { clase: 'mapa', 'aria-label': 'Mapa de preguntas' },
          intento.preguntas.map((_, indice) =>
            crear('button', {
              type: 'button',
              clase: claseCasillaMapa(intento, indice),
              'aria-label': `Ir a la pregunta ${indice + 1}`,
              'aria-current': indice === intento.indice ? 'step' : false,
              texto: String(indice + 1),
              onclick: () => {
                intento.indice = indice;
                redibujar();
              },
            }),
          ),
        ),
        crearEnunciado(pregunta),
        crearOpciones(pregunta, {
          seleccionada: intento.respuestas[pregunta.id] ?? null,
          alElegir: (letra) => {
            intento.respuestas[pregunta.id] = letra;
            redibujar();
          },
        }),
        crear('div', { clase: 'acciones' }, [
          crear('button', {
            type: 'button',
            clase: 'btn',
            texto: 'Anterior',
            disabled: intento.indice === 0,
            onclick: () => {
              intento.indice -= 1;
              redibujar();
            },
          }),
          intento.indice < total - 1
            ? crear('button', {
                type: 'button',
                clase: 'btn',
                texto: 'Siguiente',
                onclick: () => {
                  intento.indice += 1;
                  redibujar();
                },
              })
            : null,
          crear('button', {
            type: 'button',
            clase: 'btn btn--primario',
            texto: 'Terminar simulacro',
            onclick: () => confirmarEntrega(contenedor, contexto, intento),
          }),
        ]),
      ]),
    );
  }

  function mostrarPausa(contenedor, contexto, intento) {
    const total = intento.preguntas.length;
    const restante = restanteActual(intento);
    contenedor.replaceChildren(
      crear('section', { clase: 'tarjeta simulacro simulacro--pausa' }, [
        crear('h1', { texto: 'Simulacro en pausa' }),
        crear('p', {
          clase: claseReloj(restante),
          'data-reloj': true,
          'aria-label': 'Tiempo restante',
          texto: formatearTiempo(restante),
        }),
        crear('p', {
          texto: `Vas por la pregunta ${intento.indice + 1} de ${total}. El tiempo está detenido y las preguntas se ocultan hasta que reanudes.`,
        }),
        crear('div', { clase: 'acciones' }, [
          crear('button', {
            type: 'button',
            clase: 'btn btn--primario',
            texto: 'Reanudar',
            onclick: () => reanudarTiempo(contenedor, contexto, intento),
          }),
        ]),
      ]),
    );
  }

  function mostrarTiempoAgotado(contenedor, contexto, intento) {
    const total = intento.preguntas.length;
    const respondidas = Object.keys(intento.respuestas).length;
    const { duracionMinutos } = ns.Configuracion.simulacro;
    contenedor.replaceChildren(
      crear('section', { clase: 'tarjeta simulacro simulacro--agotado' }, [
        crear('h1', { texto: 'Se agotó el tiempo estimado' }),
        crear('p', {
          texto: `Ibas por la pregunta ${intento.indice + 1} de ${total}, con ${respondidas} respondidas. Tus respuestas se conservan.`,
        }),
        crear('p', {
          texto: `Puedes reiniciar el tiempo (${duracionMinutos} minutos) y seguir desde esa pregunta, o entregar el simulacro ahora.`,
        }),
        crear('div', { clase: 'acciones' }, [
          crear('button', {
            type: 'button',
            clase: 'btn btn--primario',
            texto: 'Reiniciar tiempo y continuar',
            onclick: () => reiniciarTiempo(contenedor, contexto, intento),
          }),
          crear('button', {
            type: 'button',
            clase: 'btn',
            texto: 'Entregar simulacro',
            onclick: () => confirmarEntrega(contenedor, contexto, intento),
          }),
        ]),
      ]),
    );
  }

  /* Entrega */

  function confirmarEntrega(contenedor, contexto, intento) {
    const sinResponder = intento.preguntas.length - Object.keys(intento.respuestas).length;
    if (sinResponder > 0 && !confirm(`Te faltan ${sinResponder} preguntas por responder. ¿Quieres entregar el simulacro de todos modos?`)) {
      return;
    }
    finalizarIntento(contenedor, contexto, intento);
  }

  function finalizarIntento(contenedor, contexto, intento) {
    cerrarTramo(intento);
    clearInterval(intento.temporizador);
    contexto.establecerSesionActiva(null);

    const { aciertosMinimos } = ns.Configuracion.simulacro;
    const evaluacion = ns.Simulacro.evaluarRespuestas(intento.preguntas, intento.respuestas, aciertosMinimos);
    const ahora = new Date().toISOString();

    let progreso = contexto.obtenerProgreso();
    intento.preguntas.forEach((pregunta) => {
      const letra = intento.respuestas[pregunta.id];
      if (letra) {
        progreso = ns.Progreso.registrarRespuesta(progreso, pregunta.id, letra === pregunta.respuestaCorrecta, ahora);
      }
    });

    const resumen = {
      id: ahora,
      fecha: ahora,
      aciertos: evaluacion.aciertos,
      total: evaluacion.total,
      sinResponder: evaluacion.sinResponder,
      aprobado: evaluacion.aprobado,
      duracionSegundos: Math.round(intento.tiempoUsadoMs / 1000),
      tiempoAgotado: intento.vencimientos > 0,
    };
    contexto.guardarProgreso(ns.Progreso.registrarSimulacro(progreso, resumen));
    mostrarResultado(contenedor, contexto, evaluacion, resumen);
  }

  function mensajeResultado(evaluacion) {
    const { aciertosMinimos } = ns.Configuracion.simulacro;
    if (evaluacion.aprobado) {
      return `Aprobado en el simulador con ${evaluacion.aciertos} de ${evaluacion.total} aciertos.`;
    }
    return `No alcanzaste el mínimo: ${evaluacion.aciertos} de ${evaluacion.total} aciertos. Se necesitan ${aciertosMinimos}.`;
  }

  function mostrarResultado(contenedor, contexto, evaluacion, resumen) {
    const revision = evaluacion.detalle.map((elemento, indice) =>
      crear('article', { clase: 'revision__item' }, [
        crear('h3', { texto: `Pregunta ${indice + 1}` }),
        crearEnunciado(elemento.pregunta),
        crearOpciones(elemento.pregunta, {
          seleccionada: elemento.elegida,
          bloqueada: true,
          mostrarCorreccion: true,
        }),
        crearRetroalimentacion(elemento.pregunta, elemento.estado, contexto.buscarFuente),
      ]),
    );

    contenedor.replaceChildren(
      crear('section', { clase: `tarjeta resultado ${evaluacion.aprobado ? 'resultado--aprobado' : 'resultado--reprobado'}` }, [
        crear('h1', { texto: evaluacion.aprobado ? 'Simulacro aprobado' : 'Simulacro no aprobado' }),
        crear('p', { clase: 'resultado__puntaje', texto: `${evaluacion.aciertos}/${evaluacion.total}` }),
        crear('p', { texto: mensajeResultado(evaluacion) }),
        resumen.tiempoAgotado
          ? crear('p', { clase: 'aviso aviso--advertencia', texto: 'Este intento llegó a agotar el tiempo en algún momento.' })
          : null,
        crear('ul', { clase: 'resumen-cifras' }, [
          crear('li', { texto: `Correctas: ${evaluacion.aciertos}` }),
          crear('li', { texto: `Incorrectas: ${evaluacion.incorrectas}` }),
          crear('li', { texto: `Sin responder: ${evaluacion.sinResponder}` }),
          crear('li', { texto: `Tiempo usado: ${formatearTiempo(resumen.duracionSegundos * 1000)}` }),
        ]),
        crear('p', {
          clase: 'aviso-suave',
          texto: 'Este resultado es solo práctica. El examen oficial del MTC puede ser distinto y este simulador no garantiza aprobarlo.',
        }),
        crear('div', { clase: 'acciones' }, [
          crear('button', {
            type: 'button',
            clase: 'btn btn--primario',
            texto: 'Nuevo simulacro',
            onclick: () => mostrarPortada(contenedor, contexto),
          }),
          crear('button', { type: 'button', clase: 'btn', texto: 'Practicar falladas', onclick: () => contexto.navegar('/refuerzo') }),
        ]),
        crear('details', { clase: 'revision' }, [
          crear('summary', { texto: `Revisar las ${evaluacion.total} respuestas` }),
          ...revision,
        ]),
      ]),
    );
  }

  ns.Vistas = Object.assign(ns.Vistas || {}, { simulacro: renderizarSimulacro });
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/**
 * Estadísticas: dominio, historial de simulacros y rendimiento por tema.
 */
(function (raiz) {
  const ns = (raiz.SimuladorA1 = raiz.SimuladorA1 || {});
  const { crear } = ns.Dom;
  const { formatearTiempo } = ns.Componentes;

  function metrica(titulo, valor, detalle) {
    return crear('div', { clase: 'metrica tarjeta' }, [
      crear('span', { clase: 'metrica__titulo', texto: titulo }),
      crear('span', { clase: 'metrica__valor', texto: valor }),
      crear('span', { clase: 'metrica__detalle', texto: detalle }),
    ]);
  }

  function barraDominio(porcentaje) {
    return crear('div', { clase: 'tarjeta' }, [
      crear('h2', { texto: 'Dominio del banco' }),
      crear('p', { clase: 'aviso-suave', texto: 'Una pregunta se considera dominada cuando la respondes bien dos veces seguidas.' }),
      crear('div', { clase: 'barra-progreso', role: 'progressbar', 'aria-valuenow': String(porcentaje), 'aria-valuemin': '0', 'aria-valuemax': '100' }, [
        crear('div', { clase: 'barra-progreso__relleno', style: `width: ${porcentaje}%` }),
      ]),
    ]);
  }

  function estadoTema(tema) {
    if (tema.respuestas === 0) return 'Sin datos';
    if (tema.bajoRendimiento) return 'Bajo rendimiento';
    return 'Adecuado';
  }

  function tablaTemas(rendimientoPorTema) {
    if (rendimientoPorTema.length === 0) {
      return crear('p', { texto: 'Aún no hay temas en el banco.' });
    }
    return crear('div', { clase: 'tabla-scroll' }, [
      crear('table', {}, [
        crear('thead', {}, [
          crear('tr', {}, ['Tema', 'Respuestas', 'Aciertos', 'Estado'].map((texto) => crear('th', { texto, scope: 'col' }))),
        ]),
        crear(
          'tbody',
          {},
          rendimientoPorTema.map((tema) =>
            crear('tr', {}, [
              crear('td', { texto: tema.nombre }),
              crear('td', { texto: String(tema.respuestas) }),
              crear('td', { texto: tema.respuestas ? `${tema.porcentaje}%` : '–' }),
              crear('td', { texto: estadoTema(tema) }),
            ]),
          ),
        ),
      ]),
    ]);
  }

  function tablaHistorial(historial, cantidadPreguntas) {
    if (historial.length === 0) {
      return crear('p', { texto: 'Todavía no has hecho ningún simulacro.' });
    }
    return crear('div', { clase: 'tabla-scroll' }, [
      crear('table', {}, [
        crear('thead', {}, [
          crear('tr', {}, ['Fecha', 'Aciertos', 'Resultado', 'Tiempo'].map((texto) => crear('th', { texto, scope: 'col' }))),
        ]),
        crear(
          'tbody',
          {},
          historial.map((simulacro) =>
            crear('tr', {}, [
              crear('td', { texto: new Date(simulacro.fecha).toLocaleString('es-PE') }),
              crear('td', { texto: `${simulacro.aciertos}/${cantidadPreguntas}` }),
              crear('td', { texto: simulacro.aprobado ? 'Aprobado' : 'No aprobado' }),
              crear('td', { texto: formatearTiempo(simulacro.duracionSegundos * 1000) }),
            ]),
          ),
        ),
      ]),
    ]);
  }

  function renderizarEstadisticas(contenedor, contexto) {
    const { banco } = contexto;
    const { cantidadPreguntas } = ns.Configuracion.simulacro;
    const estadisticas = ns.Estadisticas.calcularEstadisticas(banco, contexto.obtenerProgreso());
    const promedioTexto = estadisticas.promedioAciertos === null ? 'Sin datos' : `${estadisticas.promedioAciertos}/${cantidadPreguntas}`;
    const mejorTexto = estadisticas.mejorAciertos === null ? 'Sin datos' : `${estadisticas.mejorAciertos}/${cantidadPreguntas}`;

    const botonReinicio = crear('button', {
      type: 'button',
      clase: 'btn btn--peligro',
      texto: 'Borrar todo el progreso',
      onclick: () => {
        if (!confirm('¿Borrar todo el progreso guardado en este navegador? Esta acción no se puede deshacer.')) return;
        contexto.reiniciarProgreso();
        renderizarEstadisticas(contenedor, contexto);
      },
    });

    contenedor.replaceChildren(
      crear('h1', { texto: 'Estadísticas' }),
      crear('div', { clase: 'tarjetas-metricas' }, [
        metrica('Dominadas', `${estadisticas.porcentajeDominadas}%`, `${estadisticas.preguntasDominadas} de ${estadisticas.totalPreguntas}`),
        metrica('Respondidas', String(estadisticas.preguntasRespondidas), `de ${estadisticas.totalPreguntas} preguntas`),
        metrica('Simulacros', String(estadisticas.cantidadSimulacros), `${estadisticas.simulacrosAprobados} aprobados`),
        metrica('Promedio', promedioTexto, 'aciertos por simulacro'),
        metrica('Mejor resultado', mejorTexto, 'aciertos en un simulacro'),
      ]),
      barraDominio(estadisticas.porcentajeDominadas),
      crear('section', { clase: 'tarjeta' }, [
        crear('h2', { texto: 'Rendimiento por tema' }),
        tablaTemas(estadisticas.rendimientoPorTema),
      ]),
      crear('section', { clase: 'tarjeta' }, [
        crear('h2', { texto: 'Historial de simulacros' }),
        tablaHistorial(estadisticas.historialSimulacros, cantidadPreguntas),
      ]),
      crear('div', { clase: 'acciones' }, [botonReinicio]),
    );
  }

  ns.Vistas = Object.assign(ns.Vistas || {}, { estadisticas: renderizarEstadisticas });
})(typeof window !== 'undefined' ? window : globalThis);

  </script>
  <script>
/**
 * Arranque de la aplicación: carga el banco, enruta por hash y gestiona la navegación.
 * Así la app funciona abriendo index.html directamente, sin servidor.
 */
(function (raiz) {
  const ns = raiz.SimuladorA1;
  const { crear } = ns.Dom;
  const RUTAS = ['/inicio', '/simulacro', '/estudio', '/refuerzo', '/estadisticas'];
  const contenedor = document.getElementById('app');
  const almacen = ns.Progreso.obtenerAlmacenamiento();

  function validarBancoCargado(datos) {
    if (!datos) {
      return { banco: null, errores: ['No se encontró data/banco-preguntas.js. Ejecuta: node scripts/generar-banco.js'] };
    }
    const resultado = ns.Banco.validar(datos);
    return resultado.valido ? { banco: datos, errores: [] } : { banco: null, errores: resultado.errores };
  }

  const { banco, errores } = validarBancoCargado(raiz.BANCO_PREGUNTAS);
  let progreso = ns.Progreso.cargar(almacen);
  let rutaActual = null;
  let limpiarSesionActiva = null;

  const contexto = {
    banco,
    obtenerProgreso: () => progreso,
    guardarProgreso(nuevoProgreso) {
      progreso = nuevoProgreso;
      return ns.Progreso.guardar(nuevoProgreso, almacen);
    },
    reiniciarProgreso() {
      progreso = ns.Progreso.reiniciar(almacen);
    },
    establecerSesionActiva(limpiar) {
      limpiarSesionActiva = typeof limpiar === 'function' ? limpiar : null;
    },
    navegar(ruta) {
      location.hash = `#${ruta}`;
    },
    buscarFuente(id) {
      return (banco?.meta?.fuentes ?? []).find((fuente) => fuente.id === id) ?? null;
    },
  };

  function leerRuta() {
    const ruta = location.hash.replace(/^#/, '') || '/inicio';
    return RUTAS.includes(ruta) ? ruta : '/inicio';
  }

  function actualizarNavegacion() {
    document.querySelectorAll('.navegacion a').forEach((enlace) => {
      if (enlace.getAttribute('href') === `#${rutaActual}`) {
        enlace.setAttribute('aria-current', 'page');
      } else {
        enlace.removeAttribute('aria-current');
      }
    });
  }

  function renderizarErrorBanco() {
    contenedor.replaceChildren(
      crear('section', { clase: 'tarjeta aviso aviso--advertencia' }, [
        crear('h1', { texto: 'El banco de preguntas no es válido' }),
        crear('p', { texto: 'Corrige estos puntos en data/banco-preguntas.json y vuelve a generar el archivo:' }),
        crear('ul', {}, errores.map((error) => crear('li', { texto: error }))),
      ]),
    );
  }

  function renderizar() {
    actualizarNavegacion();
    if (!banco) {
      renderizarErrorBanco();
      return;
    }
    const vistas = ns.Vistas;
    const mapaVistas = {
      '/inicio': vistas.inicio,
      '/simulacro': vistas.simulacro,
      '/estudio': vistas.estudio,
      '/refuerzo': vistas.refuerzo,
      '/estadisticas': vistas.estadisticas,
    };
    mapaVistas[rutaActual](contenedor, contexto);
    window.scrollTo(0, 0);
    contenedor.focus();
  }

  function alCambiarRuta() {
    const destino = leerRuta();
    if (destino === rutaActual) return;

    if (limpiarSesionActiva && !confirm('Si sales ahora, se perderá el simulacro en curso. ¿Quieres salir?')) {
      location.hash = `#${rutaActual}`;
      return;
    }
    if (limpiarSesionActiva) {
      limpiarSesionActiva();
      limpiarSesionActiva = null;
    }

    rutaActual = destino;
    renderizar();
  }

  window.addEventListener('hashchange', alCambiarRuta);
  alCambiarRuta();
})(typeof window !== 'undefined' ? window : globalThis);

  </script>

  <!-- Avisos si falta algo: la app no cargó, o faltan las imágenes de las señales. -->
  <script>
    window.addEventListener('load', function () {
      function mostrarAviso(texto) {
        var aviso = document.createElement('div');
        aviso.className = 'tarjeta aviso aviso--advertencia';
        aviso.setAttribute('role', 'alert');
        aviso.textContent = texto;
        document.getElementById('app').before(aviso);
      }
      var appCargada = Boolean(window.SimuladorA1 && window.SimuladorA1.Vistas);
      if (!appCargada) {
        mostrarAviso('La app no cargó. Descarga la carpeta completa de Drive, con sus subcarpetas, y abre index.html desde esa carpeta.');
        return;
      }
      var sonda = new Image();
      sonda.onerror = function () {
        mostrarAviso('Faltan las imágenes de las señales. Descarga también la carpeta imagenes/balotario, junto a index.html. Las preguntas funcionan igual, pero sin imagen.');
      };
      sonda.src = 'imagenes/balotario/P004.png';
    });
  </script>
</body>
